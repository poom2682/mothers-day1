<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>จดหมายถึงแม่ ❤️</title>

    <link rel="stylesheet" href="envelope.css">
</head>

<body>

    <div class="background">
        <div class="sparkle">✦</div>
        <div class="sparkle">✧</div>
        <div class="sparkle">✦</div>
        <div class="sparkle">✧</div>
    </div>

    <main>

        <h1>💌 มีจดหมายถึงแม่</h1>

        <p class="hint">
            กดที่ซองจดหมายเพื่อเปิด
        </p>

        <div class="envelope-area">

            <div class="envelope" id="envelope">

                <div class="back"></div>

                <div class="letter">

                    <div class="letter-content">

                        <div class="mini-flower">
                            🌷
                        </div>

                        <h2>ถึงแม่ ❤️</h2>

                        <p>
                            ขอบคุณสำหรับทุกสิ่ง
                            ที่แม่ทำให้น้องเสมอมา
                        </p>

                        <p>
                            รักแม่นะครับ ❤️
                        </p>

                    </div>

                </div>

                <div class="front"></div>

                <div class="flap"></div>

            </div>

        </div>

        <button id="openButton">
            💌 เปิดจดหมาย
        </button>

        <button id="enterButton">
            🌷 ไปดูของขวัญ
        </button>

    </main>

    <script src="envelope.js"></script>

</body>
</html>
